name: Actualizează feed-ul HTube

on:
  schedule:
    - cron: "17 */2 * * *"   # la fiecare 2 ore
  workflow_dispatch: {}       # buton manual: Actions → Run workflow
  push:
    paths: ["channels.json"]  # imediat ce schimbi canalele

permissions:
  contents: write

concurrency:
  group: feed
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Adu clipurile noi
        run: python scripts/update_feed.py
      - name: Salvează feed-ul
        run: |
          git config user.name "htube-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add feed.json channel_ids.json
          git diff --cached --quiet || (git commit -m "Feed actualizat $(date -u +%Y-%m-%dT%H:%MZ)" && git push)
