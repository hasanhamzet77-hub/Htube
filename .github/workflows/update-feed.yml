name: Actualizează feed-ul HTube

on:
  schedule:
    - cron: "17 */2 * * *"   # la fiecare 2 ore
  workflow_dispatch: {}       # buton manual: Actions → Run workflow
  push:
    paths: ["channels.json", "scripts/**"]  # imediat ce schimbi persoanele sau colectorul

permissions:
  contents: write

concurrency:
  group: feed
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 20
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Adu clipurile noi
        run: python scripts/update_feed.py
      - name: Salvează feed-ul
        run: |
          git config user.name "htube-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add feed.json channel_ids.json
          git diff --cached --quiet && exit 0
          git commit -m "Feed actualizat $(date -u +%Y-%m-%dT%H:%MZ)"
          # dacă între timp a apărut alt commit (o modificare a aplicației), îl luăm și încercăm din nou
          for i in 1 2 3; do
            git push && exit 0
            git pull --rebase -X theirs origin "${GITHUB_REF_NAME}" || { git rebase --abort; exit 1; }
            sleep 3
          done
          exit 1
