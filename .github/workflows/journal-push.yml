name: Reamintire jurnal

on:
  schedule:
    - cron: "5,35 15-21 * * *"   # seara, ora Germaniei (UTC+1/+2); scriptul alege momentul potrivit
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: journal-push
  cancel-in-progress: false

jobs:
  push:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
        with:
          sparse-checkout: |
            push
            scripts
      - name: Există abonamente?
        id: chk
        run: |
          if [ "$(tr -d '[:space:]' < push/subs.json)" = "[]" ]; then echo "go=0" >> "$GITHUB_OUTPUT"; else echo "go=1" >> "$GITHUB_OUTPUT"; fi
          echo "d=$(TZ=Europe/Berlin date +%F)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache/restore@v4
        if: steps.chk.outputs.go == '1'
        with:
          path: .pushsent
          key: pushsent-${{ steps.chk.outputs.d }}-${{ github.run_id }}
          restore-keys: pushsent-${{ steps.chk.outputs.d }}-
      - uses: actions/setup-node@v5
        if: steps.chk.outputs.go == '1'
        with:
          node-version: "22"
      - name: Trimite notificarea
        if: steps.chk.outputs.go == '1'
        env:
          VAPID_PRIVATE: ${{ secrets.VAPID_PRIVATE }}
        run: |
          npm i --no-save --silent web-push@3
          node scripts/push_journal.mjs
          if [ -f .pushsent/changed ]; then rm .pushsent/changed; echo "SAVE=1" >> "$GITHUB_ENV"; fi
      - uses: actions/cache/save@v4
        if: env.SAVE == '1'
        with:
          path: .pushsent
          key: pushsent-${{ steps.chk.outputs.d }}-${{ github.run_id }}
