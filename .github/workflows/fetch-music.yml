name: Muzică de fundal (fără reclame)

on:
  workflow_dispatch: {}
  push:
    paths: ["scripts/fetch_music.py"]

permissions:
  contents: write

concurrency:
  group: music
  cancel-in-progress: false

jobs:
  music:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 20
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Instalează ffmpeg
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
      - name: Descarcă și pregătește muzica (Kevin MacLeod, CC BY 4.0)
        run: python scripts/fetch_music.py
      - name: Salvează
        run: |
          git config user.name "htube-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A music music.json music_log.txt
          git diff --cached --quiet && exit 0
          git commit -m "Muzică de fundal $(date -u +%Y-%m-%d)"
          for i in 1 2 3; do
            git push && exit 0
            git pull --rebase -X theirs origin "${GITHUB_REF_NAME}" || { git rebase --abort; exit 1; }
            sleep 3
          done
          exit 1
