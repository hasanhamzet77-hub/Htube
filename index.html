<!doctype html>
<html lang="ro">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>HTube</title>
<meta name="theme-color" content="#2f4fd8">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="HTube">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Figtree:wght@400;500;600&display=swap">
<style>
/* Layout: o singură coloană de telefon — bară de brand, categorii, gândul zilei, feed, bară de tab-uri jos */
:root{
  --bg:#eef1f6; --surface:#ffffff; --ink:#151a2b; --muted:#5d6580; --line:#d9deea;
  --accent:#2f4fd8; --accent-soft:#e3e8fc; --on-accent:#ffffff; --gold:#b86e00;
  --c-mot:#c2410c; --c-biz:#2f4fd8; --c-dev:#7c3aed; --c-soc:#0f8a6a; --c-san:#c0264b;
  --display:"Bricolage Grotesque","Segoe UI",system-ui,sans-serif;
  --body:"Figtree",system-ui,-apple-system,sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){:root{
  --bg:#0f1322; --surface:#171c30; --ink:#e8ebf5; --muted:#99a1bd; --line:#283050;
  --accent:#8ea2ff; --accent-soft:#232c55; --on-accent:#0f1322; --gold:#f2b14a;
  --c-mot:#fb8a56; --c-biz:#8ea2ff; --c-dev:#b79bff; --c-soc:#4fd1a8; --c-san:#ff7a98; color-scheme:dark}}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.5;-webkit-tap-highlight-color:transparent}
.wrap{max-width:620px;margin:0 auto;padding-inline:16px;padding-block:0 calc(90px + env(safe-area-inset-bottom,0px))}
header{position:sticky;top:0;z-index:5;background:var(--bg);padding-top:calc(12px + env(safe-area-inset-top,0px));padding-bottom:8px;display:flex;align-items:center;justify-content:space-between;gap:12px}
.brand{font-family:var(--display);font-weight:800;font-size:28px;letter-spacing:-.02em}
.brand span{color:var(--accent)}
.tag{font-size:12px;color:var(--muted)}
.chips{display:flex;gap:8px;overflow-x:auto;padding-block:4px 12px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:999px;padding:7px 14px;font:600 13px var(--body);cursor:pointer}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
button:focus-visible,a:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.daily{background:var(--accent);color:var(--on-accent);border-radius:18px;padding:20px;margin-block:4px 16px;display:grid;gap:10px}
.daily small{text-transform:uppercase;letter-spacing:.1em;font-size:11px;font-weight:600;opacity:.85}
.daily q{font-family:var(--display);font-weight:600;font-size:22px;line-height:1.25;text-wrap:balance;quotes:"„" "”"}
.daily .by{font-size:13px;opacity:.9}
.feed{display:grid;gap:12px}
.post{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:14px 16px;display:grid;gap:8px;min-width:0}
.meta{display:flex;align-items:center;gap:8px;font-size:13px}
.meta>div{min-width:0}
.av{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;font:800 14px var(--display);color:#fff;flex:none}
.who{font-weight:600}
.vf{color:var(--gold);font-size:12px;font-weight:600;white-space:nowrap}
.cat{margin-left:auto;font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.08em;text-align:right}
.kind{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.08em}
.post h3{margin:0;font-family:var(--display);font-weight:600;font-size:18px;line-height:1.3;text-wrap:balance}
.post p{margin:0}
.src{font-size:12.5px;color:var(--muted)}
.src a{color:var(--accent);font-weight:600;text-decoration:none}
.video{position:relative;width:100%;aspect-ratio:16/9;border-radius:12px;overflow:hidden;background:#000;border:0;padding:0;cursor:pointer;display:block}
.video img{width:100%;height:100%;object-fit:cover;display:block;opacity:.9}
.video .pb{position:absolute;inset:0;display:grid;place-items:center}
.video .pb span{width:62px;height:62px;border-radius:50%;background:var(--accent);display:grid;place-items:center;box-shadow:0 6px 20px rgba(0,0,0,.35)}
.video .pb svg{fill:var(--on-accent);margin-left:4px}
.video iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
.vch{font-size:12.5px;color:var(--muted)}
.acts{display:flex;gap:6px;flex-wrap:wrap}
.act{border:0;background:transparent;color:var(--muted);font:500 13px var(--body);padding:6px 10px;border-radius:8px;cursor:pointer}
.act:hover{background:var(--accent-soft);color:var(--ink)}
.act[aria-pressed="true"]{color:var(--accent);font-weight:600}
.empty{text-align:center;color:var(--muted);padding:40px 10px}
.srcs{display:grid;gap:10px}
.srow{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px 14px;display:flex;gap:12px;align-items:center}
.srow div{min-width:0}
.srow b{display:block}
.srow span{font-size:12.5px;color:var(--muted)}
.lvl{margin-left:auto;font-size:11px;font-weight:600;padding:3px 8px;border-radius:999px;background:var(--accent-soft);color:var(--accent);flex:none}
form{display:grid;gap:8px;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px;margin-block:6px 18px}
input,select{font:inherit;font-size:16px;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:9px 11px;width:100%}
.btn{border:0;background:var(--accent);color:var(--on-accent);font:600 15px var(--body);border-radius:10px;padding:11px;cursor:pointer}
.msg{font-size:13px;color:var(--muted);min-height:1em}
h2{font-family:var(--display);font-size:20px;margin:6px 0 10px}
nav{position:fixed;left:0;right:0;bottom:0;background:var(--surface);border-top:1px solid var(--line);display:flex;justify-content:center;padding-bottom:env(safe-area-inset-bottom,0px);z-index:6}
.tab{flex:1;max-width:200px;border:0;background:transparent;color:var(--muted);font:600 12px var(--body);padding:10px 4px 12px;cursor:pointer;display:grid;justify-items:center;gap:3px}
.tab svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:2}
.tab[aria-selected="true"]{color:var(--accent)}
@media (prefers-reduced-motion:no-preference){.post{animation:in .25s ease both}@keyframes in{from{transform:translateY(4px)}}}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div><div class="brand">H<span>Tube</span></div><div class="tag">Doar ce te face mai bun. Fără știri.</div></div>
    <div class="tag" id="count"></div>
  </header>

  <section id="v-feed">
    <div class="chips" id="chips" role="toolbar" aria-label="Categorii"></div>
    <div class="daily" id="daily"></div>
    <div class="feed" id="feed"></div>
  </section>

  <section id="v-video" hidden>
    <h2>Clipuri</h2>
    <div class="feed" id="videos"></div>
  </section>

  <section id="v-saved" hidden>
    <h2>Salvate</h2>
    <div class="feed" id="saved"></div>
  </section>

  <section id="v-src" hidden>
    <h2>Adaugă un clip</h2>
    <form id="addv">
      <input id="vurl" placeholder="Lipește linkul YouTube" required>
      <select id="vcat"></select>
      <input id="vtitle" placeholder="Despre ce e? (opțional)">
      <button class="btn" type="submit">Adaugă în feed</button>
      <div class="msg" id="vmsg"></div>
    </form>
    <h2>Sursele tale</h2>
    <div class="srcs" id="srcs"></div>
    <form id="addf">
      <b>Adaugă o sursă</b>
      <input id="sname" placeholder="Nume (ex: Alex Hormozi)" required>
      <select id="scat"></select>
      <input id="sdesc" placeholder="Carte, canal sau site (opțional)">
      <button class="btn" type="submit">Adaugă sursa</button>
    </form>
  </section>
</div>

<nav role="tablist">
  <button class="tab" role="tab" data-v="feed" aria-selected="true"><svg viewBox="0 0 24 24"><path d="M3 11l9-7 9 7v9a1 1 0 0 1-1 1h-5v-6h-6v6H4a1 1 0 0 1-1-1z"/></svg>Feed</button>
  <button class="tab" role="tab" data-v="video" aria-selected="false"><svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="14" rx="3"/><path d="M10 9l5 3-5 3z"/></svg>Clipuri</button>
  <button class="tab" role="tab" data-v="saved" aria-selected="false"><svg viewBox="0 0 24 24"><path d="M6 3h12v18l-6-4-6 4z"/></svg>Salvate</button>
  <button class="tab" role="tab" data-v="src" aria-selected="false"><svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 21c1-4 4-6 8-6s7 2 8 6"/></svg>Surse</button>
</nav>

<script>
const CATS={mot:"Motivație",biz:"Afaceri",dev:"Dezvoltare personală",soc:"Socializare",san:"Sănătate"};

const SOURCES=[
 {n:"Marcus Aurelius",c:"mot",d:"Meditații (sec. II)",l:"Clasic"},
 {n:"Seneca",c:"mot",d:"Scrisori către Lucilius",l:"Clasic"},
 {n:"Epictet",c:"dev",d:"Manualul (Enchiridion)",l:"Clasic"},
 {n:"Alex Hormozi",c:"biz",d:"$100M Offers, $100M Leads",l:"Practician"},
 {n:"Paul Graham",c:"biz",d:"Eseuri, fondator Y Combinator",l:"Practician"},
 {n:"Naval Ravikant",c:"biz",d:"Eseuri și podcast despre avere",l:"Practician"},
 {n:"James Clear",c:"dev",d:"Atomic Habits",l:"Carte"},
 {n:"Cal Newport",c:"dev",d:"Deep Work, profesor Georgetown",l:"Carte"},
 {n:"Jocko Willink",c:"dev",d:"Extreme Ownership",l:"Carte"},
 {n:"Dale Carnegie",c:"soc",d:"Cum să-ți faci prieteni (1936)",l:"Carte"},
 {n:"Chris Voss",c:"soc",d:"Fost negociator FBI",l:"Practician"},
 {n:"Robert Cialdini",c:"soc",d:"Influence, psiholog",l:"Cercetare"},
 {n:"Andrew Huberman",c:"san",d:"Neurolog, Stanford",l:"Medic/Cercetare"},
 {n:"Peter Attia",c:"san",d:"Medic, Outlive",l:"Medic"},
 {n:"Brian Tracy",c:"dev",d:"Eat That Frog!, obiective și productivitate",l:"Carte"},
 {n:"Simon Sinek",c:"biz",d:"Start With Why, leadership",l:"Carte"},
 {n:"Mel Robbins",c:"mot",d:"The 5 Second Rule",l:"Practician"},
 {n:"OMS / WHO",c:"san",d:"Ghiduri oficiale de sănătate",l:"Oficial"}
];

// vid = ID YouTube verificat; ch = canalul care a publicat clipul
const POSTS=[
 {id:1,c:"mot",who:"Marcus Aurelius",k:"Citat",t:"Ai putere asupra minții tale, nu asupra evenimentelor din afară. Înțelege asta și vei găsi tăria.",s:"Meditații, sec. II (traducere liberă)"},
 {id:3,c:"san",who:"Andrew Huberman",k:"Clip",h:"Lumina de dimineață",t:"5–10 minute de lumină naturală afară, în prima oră după trezire, ajută la fixarea ritmului circadian: mai multă energie ziua, somn mai bun noaptea.",s:"Huberman Lab",vid:"WDv4AWk0J3U",ch:"Huberman Lab Clips"},
 {id:2,c:"biz",who:"Alex Hormozi",k:"Clip",h:"Oferte la care e greu să spui nu",t:"Valoarea percepută crește când rezultatul dorit e mare și sigur, și scade cu cât clientul așteaptă mai mult și depune mai mult efort. Lucrează pe toți cei patru factori, nu doar pe preț.",s:"$100M Offers (2021)",vid:"qkS_pb97TyA",ch:"Plus Ultra Podcast (interviu)"},
 {id:4,c:"dev",who:"James Clear",k:"Clip",h:"1% mai bine pe zi",t:"Nu-ți fixa doar obiective, construiește sisteme. Fă obiceiul bun evident, atractiv, ușor și satisfăcător. Pe cel rău, invers.",s:"Atomic Habits (2018)",vid:"DELOQ4J6qc0",ch:"Carey Nieuwhof (interviu)"},
 {id:5,c:"soc",who:"Chris Voss",k:"Clip",h:"Oglindirea",t:"Repetă ultimele 1–3 cuvinte spuse de celălalt, pe ton de întrebare. Omul continuă să vorbească și îți dă mai multe informații, fără să simtă presiune.",s:"Never Split the Difference (2016)",vid:"00D3EsAO0hI",ch:"Big Think"},
 {id:6,c:"san",who:"OMS / WHO",k:"Ghid",h:"Câtă mișcare îți trebuie",t:"Adulții au nevoie de 150–300 de minute pe săptămână de efort moderat (sau 75–150 intens), plus forță de cel puțin 2 ori pe săptămână.",s:"Ghidul OMS pentru activitate fizică, 2020",url:"https://www.who.int/news-room/fact-sheets/detail/physical-activity"},
 {id:7,c:"mot",who:"Seneca",k:"Citat",t:"Nu avem prea puțin timp, ci pierdem mult din el.",s:"Despre scurtimea vieții (traducere liberă)"},
 {id:8,c:"biz",who:"Paul Graham",k:"Eseu",h:"Fă lucruri care nu se scalează",t:"La început, câștigi clienții unul câte unul, manual. Grija personală pe care o dai acum e avantajul pe care firmele mari nu-l pot copia.",s:"Do Things That Don't Scale (2013)",url:"https://paulgraham.com/ds.html"},
 {id:9,c:"dev",who:"Cal Newport",k:"Clip",h:"Munca profundă",t:"Blochează 60–90 de minute fără telefon pentru cea mai grea sarcină a zilei. Atenția fragmentată costă mai mult decât pare.",s:"Deep Work (2016)",vid:"nPzFhkTe2Uw",ch:"Cal Newport"},
 {id:10,c:"soc",who:"Dale Carnegie",k:"Principiu",h:"Numele omului",t:"Numele unei persoane e pentru ea cel mai important sunet. Reține-l și folosește-l, iar oamenii te vor ține minte.",s:"Cum să-ți faci prieteni (1936)"},
 {id:11,c:"san",who:"Peter Attia",k:"Clip",h:"Zona 2: cât și cât de des",t:"Capacitatea cardio (VO2 max) e unul dintre cei mai puternici predictori ai duratei de viață. Baza ei e mult efort ușor, în zona 2, câteva ore pe săptămână.",s:"Outlive (2023)",vid:"z82GCNXdLAA",ch:"Peter Attia MD"},
 {id:12,c:"biz",who:"Naval Ravikant",k:"Idee",h:"Pârghie",t:"Averea vine din cunoaștere specifică plus pârghie: capital, oameni, cod sau conținut. Ultimele două nu cer permisiunea nimănui.",s:"How to Get Rich (2018)"},
 {id:13,c:"dev",who:"Jocko Willink",k:"Clip",h:"Responsabilitate totală",t:"Când ceva merge prost, întreabă întâi ce puteai face tu diferit. Cine își asumă tot, controlează mai mult.",s:"Extreme Ownership (2015)",vid:"ljqra3BcqWM",ch:"TEDx Talks"},
 {id:14,c:"soc",who:"Robert Cialdini",k:"Studiu",h:"Reciprocitatea",t:"Oamenii simt nevoia să întoarcă un gest. Dă primul ceva util, fără condiții. E cel mai solid principiu de influență studiat.",s:"Influence (1984)"},
 {id:15,c:"mot",who:"Epictet",k:"Citat",t:"Nu lucrurile ne tulbură, ci părerile noastre despre ele.",s:"Manualul, cap. 5 (traducere liberă)"},
 {id:16,c:"san",who:"Andrew Huberman",k:"Clip",h:"Somnul vine primul",t:"Adulții au nevoie de cel puțin 7 ore de somn. Fără somn, antrenamentul, dieta și concentrarea dau rezultate mult mai slabe.",s:"Huberman Lab Essentials",vid:"RTgJSQtvo88",ch:"Andrew Huberman"},
 {id:18,c:"dev",who:"Epictet",k:"Principiu",h:"Dihotomia controlului",t:"Împarte orice problemă în două: ce depinde de tine și ce nu. Toată energia merge pe prima listă.",s:"Manualul, cap. 1"},
 {id:19,c:"dev",who:"Brian Tracy",k:"Clip",h:"Regula 80/20 la obiective",t:"Din 10 lucruri pe listă, 2 aduc cât celelalte 8 la un loc. Găsește-le pe acelea și începe cu ele.",s:"Brian Tracy",vid:"cdiApKj3QPg",ch:"Brian Tracy"},
 {id:20,c:"mot",who:"Brian Tracy",k:"Clip",h:"Mănâncă broasca dimineața",t:"Fă prima, la prima oră, sarcina cea mai grea și mai importantă a zilei. Restul zilei merge mai ușor.",s:"Eat That Frog! (2001)",vid:"v9eAE8sHYvs",ch:"Motivation Radio"},
 {id:21,c:"san",who:"Andrew Huberman",k:"Clip",h:"Dopamina și motivația",t:"Motivația ține de nivelul tău de bază de dopamină. Recompensele ușoare și dese (telefon, junk food) îl coboară; efortul și răbdarea îl ridică.",s:"Huberman Lab",vid:"lc0h3KaWhec",ch:"Huberman Lab Clips"},
 {id:22,c:"dev",who:"Andrew Huberman",k:"Clip",h:"Investește dopamina în efort",t:"Învață-te să simți plăcere în timpul efortului, nu doar la final. Atunci munca grea devine ceva ce poți susține ani de zile.",s:"Huberman Lab, cu Michael Easter",vid:"gMF142JSNYs",ch:"Huberman Lab Clips"},
 {id:23,c:"biz",who:"Simon Sinek",k:"Clip",h:"Începe cu De ce",t:"Oamenii nu cumpără ce faci, ci de ce o faci. Spune întâi motivul tău, apoi cum și abia la final ce vinzi.",s:"TEDxPugetSound (2009)",vid:"u4ZoJKF_VuA",ch:"TEDx Talks"},
 {id:24,c:"mot",who:"Mel Robbins",k:"Clip",h:"Regula de 5 secunde",t:"Când știi că trebuie să faci ceva, numără 5-4-3-2-1 și mișcă-te înainte ca mintea să găsească scuze.",s:"The 5 Second Rule (2017)",vid:"oOSoyZMt-D4",ch:"Mel Robbins Show"}
];

let store={saved:[],hidden:[],extra:[],clips:[]};
try{const s=JSON.parse(localStorage.getItem("htube")||"null");if(s)store=Object.assign(store,s)}catch(e){}
const persist=()=>{try{localStorage.setItem("htube",JSON.stringify(store))}catch(e){}};

let cat="all";
const $=id=>document.getElementById(id);
const esc=s=>String(s).replace(/[&<>"]/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[m]));
const ini=n=>n.split(/[\s/]+/).filter(Boolean).map(w=>w[0]).slice(0,2).join("").toUpperCase();
const color=c=>`var(--c-${c})`;
const allPosts=()=>[...store.clips,...POSTS];

function ytId(u){
  const m=String(u).match(/(?:youtu\.be\/|v=|\/shorts\/|\/embed\/|\/live\/)([A-Za-z0-9_-]{11})/);
  return m?m[1]:(/^[A-Za-z0-9_-]{11}$/.test(u.trim())?u.trim():null);
}

function chips(){
  const all=[["all","Toate"],...Object.entries(CATS)];
  $("chips").innerHTML=all.map(([k,v])=>`<button class="chip" data-c="${k}" aria-pressed="${k===cat}">${v}</button>`).join("");
}
function daily(){
  const q=POSTS.filter(p=>p.k==="Citat");
  const d=Math.floor(Date.now()/864e5)%q.length;
  $("daily").innerHTML=`<small>Gândul zilei</small><q>${q[d].t}</q><div class="by">${q[d].who} · ${q[d].s}</div>`;
}
function card(p){
  const sv=store.saved.includes(p.id);
  const vid=p.vid?`<button class="video" data-vid="${p.vid}" aria-label="Pornește clipul"><img loading="lazy" src="https://i.ytimg.com/vi/${p.vid}/hqdefault.jpg" alt=""><span class="pb"><span><svg width="22" height="22" viewBox="0 0 12 12"><path d="M3 1.5v9l7.5-4.5z"/></svg></span></span></button>${p.ch?`<div class="vch">Clip publicat de ${esc(p.ch)}</div>`:""}`:"";
  return `<article class="post">
    <div class="meta"><span class="av" style="background:${color(p.c)}">${ini(p.who)}</span>
      <div><span class="who">${esc(p.who)}</span> <span class="vf">${p.mine?"adăugat de tine":"✓ verificat"}</span><div class="kind">${p.k}</div></div>
      <span class="cat" style="color:${color(p.c)}">${CATS[p.c]}</span></div>
    ${p.h?`<h3>${esc(p.h)}</h3>`:""}
    ${p.t?`<p>${esc(p.t)}</p>`:""}
    ${vid}
    ${p.s?`<div class="src">Sursă: ${p.url?`<a href="${p.url}" target="_blank" rel="noopener">${esc(p.s)}</a>`:esc(p.s)}</div>`:""}
    <div class="acts">
      <button class="act" data-a="save" data-id="${p.id}" aria-pressed="${sv}">${sv?"Salvat":"Salvează"}</button>
      <button class="act" data-a="hide" data-id="${p.id}">${p.mine?"Șterge":"Nu-mi mai arăta"}</button>
    </div></article>`;
}
const list=(f)=>allPosts().filter(p=>!store.hidden.includes(p.id)&&f(p));
function render(){
  const fl=list(p=>cat==="all"||p.c===cat);
  $("feed").innerHTML=fl.length?fl.map(card).join(""):`<div class="empty">Nimic aici. Alege altă categorie.</div>`;
  $("count").textContent=fl.length+" postări";
  const vl=list(p=>p.vid);
  $("videos").innerHTML=vl.length?vl.map(card).join(""):`<div class="empty">Niciun clip. Adaugă unul din tab-ul Surse.</div>`;
  const sl=allPosts().filter(p=>store.saved.includes(p.id));
  $("saved").innerHTML=sl.length?sl.map(card).join(""):`<div class="empty">Apasă „Salvează” pe o postare ca s-o găsești aici.</div>`;
}
function srcs(){
  const all=[...SOURCES,...store.extra];
  $("srcs").innerHTML=all.map(s=>`<div class="srow"><span class="av" style="background:${color(s.c)}">${ini(s.n)}</span><div><b>${esc(s.n)}</b><span>${CATS[s.c]} · ${esc(s.d)}</span></div><span class="lvl">${esc(s.l)}</span></div>`).join("");
  const opts=Object.entries(CATS).map(([k,v])=>`<option value="${k}">${v}</option>`).join("");
  $("scat").innerHTML=opts; $("vcat").innerHTML=opts;
}
function stopVideos(except){
  document.querySelectorAll(".video iframe").forEach(f=>{
    const b=f.parentElement; if(b===except)return;
    const id=b.dataset.vid;
    b.innerHTML=`<img loading="lazy" src="https://i.ytimg.com/vi/${id}/hqdefault.jpg" alt=""><span class="pb"><span><svg width="22" height="22" viewBox="0 0 12 12"><path d="M3 1.5v9l7.5-4.5z"/></svg></span></span>`;
  });
}

document.addEventListener("click",e=>{
  const v=e.target.closest(".video");
  if(v&&!v.querySelector("iframe")){
    stopVideos(v);
    v.innerHTML=`<iframe src="https://www.youtube-nocookie.com/embed/${v.dataset.vid}?autoplay=1&playsinline=1&rel=0&modestbranding=1" allow="autoplay; encrypted-media; picture-in-picture; fullscreen" allowfullscreen title="Clip"></iframe>`;
    return;
  }
  const ch=e.target.closest(".chip");
  if(ch){cat=ch.dataset.c;chips();render();return}
  const a=e.target.closest(".act");
  if(a){const id=isNaN(+a.dataset.id)?a.dataset.id:+a.dataset.id;
    if(a.dataset.a==="save"){store.saved=store.saved.includes(id)?store.saved.filter(x=>x!==id):[...store.saved,id]}
    else{
      if(store.clips.some(c=>c.id===id))store.clips=store.clips.filter(c=>c.id!==id);
      else store.hidden.push(id);
      store.saved=store.saved.filter(x=>x!==id);
    }
    persist();render();return}
  const t=e.target.closest(".tab");
  if(t){stopVideos(null);
    document.querySelectorAll(".tab").forEach(b=>b.setAttribute("aria-selected",b===t));
    ["feed","video","saved","src"].forEach(x=>$("v-"+x).hidden=x!==t.dataset.v);
    window.scrollTo(0,0)}
});
$("addv").addEventListener("submit",e=>{
  e.preventDefault();
  const id=ytId($("vurl").value);
  if(!id){$("vmsg").textContent="Linkul nu pare de YouTube. Copiază-l din butonul Share al clipului.";return}
  store.clips.unshift({id:"c"+Date.now(),c:$("vcat").value,who:"Clipul tău",k:"Clip",h:$("vtitle").value.trim(),vid:id,mine:true});
  persist();render();$("addv").reset();$("vmsg").textContent="Adăugat în feed.";
});
$("addf").addEventListener("submit",e=>{
  e.preventDefault();
  const n=$("sname").value.trim(); if(!n)return;
  store.extra.push({n,c:$("scat").value,d:$("sdesc").value.trim()||"Adăugată de tine",l:"Nou"});
  persist();$("addf").reset();srcs();
});
daily();chips();srcs();render();
if("serviceWorker" in navigator)navigator.serviceWorker.register("sw.js").catch(()=>{});
</script>
